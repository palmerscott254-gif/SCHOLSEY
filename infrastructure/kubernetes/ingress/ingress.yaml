apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devicetracker-ingress
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://dashboard.devicetracker.com"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.devicetracker.com
    secretName: devicetracker-tls
  rules:
  - host: api.devicetracker.com
    http:
      paths:
      # Backend API routes
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3000
      
      # WebSocket route
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3000
      
      # AI Service routes
      - path: /v1/ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 8000

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@devicetracker.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
